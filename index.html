<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b2b">
<title>ИИТД — AI Games</title>
<style>
/* ============================================================
   1. СТИЛИ (основа — твои прежние, новые блоки помечены [НОВОЕ])
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --text:#fff; --muted:#b9c1e8; --cyan:#53e8ff; --violet:#9a5cff; --pink:#ff4fcf; }
html, body { min-height: 100%; }
body {
  font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(circle at 12% 8%, rgba(119,54,255,.22), transparent 28%),
              radial-gradient(circle at 90% 90%, rgba(35,112,255,.20), transparent 30%), #060a27;
  overflow-x: hidden;
}
body::before { /* фон-картинка сайта */
  content:""; position:fixed; inset:0; z-index:-3; pointer-events:none; opacity:.82;
  background: linear-gradient(180deg, rgba(5,8,34,.20), rgba(5,8,34,.72)), url("сайтФон.png") center / cover no-repeat;
}
button, .game-card { -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

#menu { width: min(1260px, calc(100% - 36px)); margin: 0 auto; padding: 24px 0 70px; }

/* [НОВОЕ] ОТВЕЧАЕТ ЗА: верхнюю панель (кнопки «Рекорды», «Войти», «Выйти», имя игрока) */
.topbar { display:flex; justify-content:flex-end; align-items:center; gap:10px; flex-wrap:wrap; }
.btn {
  border:1px solid rgba(91,228,255,.55); border-radius:12px; padding:9px 15px; color:#fff;
  background:rgba(32,43,105,.75); cursor:pointer; font-size:.9rem; font-weight:700; transition:.2s ease;
}
.btn:hover { background:linear-gradient(90deg,#7a4dff,#2bdfff); border-color:transparent; }
.btn.primary { background:linear-gradient(90deg,#7a4dff,#2bdfff); border-color:transparent; }
.user-chip { color:#d7dcff; font-weight:700; font-size:.92rem; }

header { position:relative; text-align:center; padding: 8px 0 34px; }
.brand { display:inline-flex; flex-direction:column; align-items:center; line-height:.92; }
.brand-small { font-size:clamp(2rem,4vw,3.5rem); font-weight:900; letter-spacing:-.05em; text-shadow:0 8px 30px rgba(70,98,255,.3); }
.brand-main {
  margin-top:5px; font-size:clamp(3rem,6vw,5.8rem); font-weight:950; letter-spacing:-.07em;
  background:linear-gradient(90deg,#ff4fd8 0%,#9c5cff 42%,#4de7ff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 10px 26px rgba(104,73,255,.28));
}
.subtitle { margin-top:12px; font-size:clamp(1rem,2vw,1.35rem); color:#d7dcff; font-weight:600; }

/* ОТВЕЧАЕТ ЗА: сетку карточек и саму карточку игры */
.games-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; }
.game-card {
  --accent:#7b5cff; position:relative; min-height:235px; display:flex; flex-direction:column; overflow:hidden; cursor:pointer;
  border:1px solid color-mix(in srgb, var(--accent) 65%, white 10%); border-radius:22px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 32%, #101741), #07102f 72%);
  box-shadow:0 16px 38px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
}
.game-card:hover {
  transform:translateY(-8px) scale(1.012); border-color:var(--accent);
  box-shadow:0 22px 55px rgba(0,0,0,.36), 0 0 30px color-mix(in srgb, var(--accent) 25%, transparent);
}

/* [НОВОЕ] ОТВЕЧАЕТ ЗА: обложку карточки (картинка; эмодзи — запасной вариант, если файла нет) */
.game-cover {
  height:150px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:5.2rem;
  background:radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 52%),
             linear-gradient(135deg, color-mix(in srgb, var(--accent) 38%, #0b1135), #07102d);
}
.game-cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
.game-card:hover .game-cover img { transform:scale(1.07); }
.game-cover span { filter:drop-shadow(0 12px 12px rgba(0,0,0,.3)); }

.game-info { position:relative; min-height:85px; padding:14px 15px 15px; background:linear-gradient(180deg, rgba(5,10,31,.74), rgba(5,9,28,.94)); border-top:1px solid rgba(255,255,255,.08); }
.game-info h3 { padding-right:38px; font-size:1.06rem; font-weight:850; letter-spacing:-.015em; margin-bottom:5px; }
.game-info p { color:#b9c3e8; font-size:.84rem; line-height:1.35; padding-right:25px; }
.best { margin-top:7px; font-size:.8rem; font-weight:700; color:var(--accent); } /* [НОВОЕ] «Твой рекорд» на карточке */
.play {
  position:absolute; right:13px; top:17px; width:34px; height:34px; display:grid; place-items:center; border-radius:50%;
  background:color-mix(in srgb, var(--accent) 75%, #111 25%); font-size:18px; font-weight:900;
}

/* Цвета карточек (добавлены sudoku и fast — раньше для них цвета не было) */
.soul{--accent:#d83cff}.snake{--accent:#25e99b}.space{--accent:#6cff39}.ping{--accent:#a452ff}
.brick{--accent:#2f8dff}.chicken{--accent:#21d7ee}.iskra{--accent:#7358ff}.chick{--accent:#ffb72d}
.ttt{--accent:#ff4caa}.billiard{--accent:#ffc72f}.crybaby{--accent:#46b8ff}.sudoku{--accent:#ff7a45}.fast{--accent:#59f0c4}

/* ОТВЕЧАЕТ ЗА: полноэкранный режим игры (шапка с кнопкой «Назад», рекордом и iframe) */
#game-screen { display:none; position:fixed; inset:0; z-index:1000; flex-direction:column; background:#02040d; }
#game-header {
  height:62px; flex:0 0 62px; display:flex; align-items:center; gap:14px; padding:0 16px;
  background:linear-gradient(90deg, rgba(8,11,39,.98), rgba(17,10,54,.98)); border-bottom:1px solid rgba(111,101,255,.35);
}
#game-title { font-size:1.08rem; font-weight:800; }
#game-best { margin-left:auto; color:var(--cyan); font-weight:700; font-size:.9rem; } /* [НОВОЕ] рекорд в шапке игры */
#game-frame { flex:1; width:100%; min-height:0; border:0; background:#000; }

/* [НОВОЕ] ОТВЕЧАЕТ ЗА: всплывающие окна (вход/регистрация и таблица рекордов), поля ввода, таблицу */
.overlay { display:none; position:fixed; inset:0; z-index:2000; align-items:center; justify-content:center; padding:16px; background:rgba(2,4,20,.75); backdrop-filter:blur(6px); }
.overlay.open { display:flex; }
.modal { width:min(440px,100%); max-height:90vh; overflow:auto; padding:24px; border-radius:20px; background:#0b1137; border:1px solid rgba(111,101,255,.45); box-shadow:0 30px 80px rgba(0,0,0,.5); }
.modal h2 { font-size:1.3rem; margin-bottom:14px; }
.tabs { display:flex; gap:8px; margin-bottom:16px; }
.tabs .btn { flex:1; }
.tabs .btn.active { background:linear-gradient(90deg,#7a4dff,#2bdfff); border-color:transparent; }
.field { display:block; margin-bottom:12px; font-size:.85rem; color:var(--muted); }
.field input, .field select {
  width:100%; margin-top:5px; padding:11px 12px; border-radius:10px; color:#fff; font-size:1rem;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18);
}
.field select option { color:#000; }
.error { min-height:1.2em; margin-bottom:10px; color:#ff8aa5; font-size:.85rem; }
.modal-actions { display:flex; gap:10px; }
.modal-actions .btn { flex:1; }
table { width:100%; border-collapse:collapse; font-size:.92rem; }
th, td { padding:8px 6px; text-align:left; border-bottom:1px solid rgba(255,255,255,.1); }
tr.me td { color:var(--cyan); font-weight:800; }
.empty { color:var(--muted); padding:14px 0; }

/* [НОВОЕ] ОТВЕЧАЕТ ЗА: всплывающее сообщение внизу («Новый рекорд», «Привет» и т.д.) */
#toast {
  position:fixed; left:50%; bottom:26px; z-index:3000; transform:translate(-50%,30px); opacity:0; pointer-events:none;
  padding:12px 18px; border-radius:12px; background:#151d55; border:1px solid var(--cyan); font-weight:700; transition:.3s ease;
}
#toast.show { opacity:1; transform:translate(-50%,0); }

@media (max-width:1050px){ .games-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:760px){
  #menu{ width:min(100% - 24px,600px); }
  .games-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
  .game-card{ min-height:215px; border-radius:18px; }
  .game-cover{ height:130px; font-size:4.2rem; }
}
@media (max-width:470px){ .games-grid{ grid-template-columns:1fr; } .game-cover{ height:135px; } }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<!-- ============================================================
     2. РАЗМЕТКА
     ============================================================ -->
<!-- ОТВЕЧАЕТ ЗА: главное меню: шапка, панель пользователя, сетка карточек -->
<main id="menu">
  <!-- [НОВОЕ] верхняя панель; кнопки наполняются функцией renderTopbar() -->
  <div class="topbar" id="topbar"></div>

  <header>
    <div class="brand">
      <div class="brand-small">ИИТД</div>
      <div class="brand-main">AI Games</div>

    </div>
  </header>

  <section class="games-grid" id="games-list" aria-label="Список игр"></section>
</main>

<!-- ОТВЕЧАЕТ ЗА: экран открытой игры; сама игра грузится в iframe (раздел 8) -->
<section id="game-screen" aria-label="Открытая игра">
  <div id="game-header">
    <button class="btn" id="back-btn">← Назад в меню</button>

  <iframe id="game-frame" src="" allowfullscreen title="Игра"></iframe>

<!-- [НОВОЕ] ОТВЕЧАЕТ ЗА: окно входа / регистрации (логика — раздел 6) -->
<div class="overlay" id="auth-overlay">
  <div class="modal" role="dialog" aria-label="Вход">
    <h2>Аккаунт</h2>
    <div class="tabs">
      <button class="btn active" data-mode="login">Вход</button>

    </div>
    <label class="field">Логин<input id="auth-user" autocomplete="username" maxlength="20"></label>

      <button class="btn primary" id="auth-submit">Войти</button>
    </div>

</div>

<!-- [НОВОЕ] ОТВЕЧАЕТ ЗА: окно таблицы рекордов (логика — раздел 10) -->
<div class="overlay" id="lb-overlay">
  <div class="modal" role="dialog" aria-label="Рекорды">
    <h2>Таблица рекордов</h2>
    <label class="field">Игра<select id="lb-game"></select></label>
    <div id="lb-body"></div>
    <div class="modal-actions" style="margin-top:14px"><button class="btn" data-close>Закрыть</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   3. СПИСОК ИГР
   ОТВЕЧАЕТ ЗА: какие игры есть в меню. Чтобы добавить игру — добавь сюда строку.
   cover  — путь к картинке карточки (положи файлы в папку covers/)
   order  — "high": чем больше счёт, тем лучше; "low": чем меньше, тем лучше (время)
   unit   — подпись рядом с числом
   Если картинки нет — автоматически покажется emoji.
   ============================================================ */
const games = [
  { id:"SoulBound", title:"SoulBound", description:"Игра про защиту души", file:"soulbound.html", cls:"soul", emoji:"👻", cover:"covers/soulbound.jpg", order:"high", unit:"очк." },
  { id:"Snake", title:"Snake", description:"Обычная змейка", file:"snake.html", cls:"snake", emoji:"🐍", cover:"covers/snake.jpg", order:"high", unit:"очк." },
  { id:"Space Jumper", title:"Space Jumper", description:"Прыгающий квадрат", file:"jumpingSquare.html", cls:"space", emoji:"🟪", cover:"covers/jumpingSquare.jpg", order:"high", unit:"очк." },
  { id:"PinPong", title:"PinPong", description:"Игра в пинг-понг на двоих", file:"pinpong.html", cls:"ping", emoji:"🏓", cover:"covers/pinpong.jpg", order:"high", unit:"очк." },
  { id:"Brick Simulator", title:"Brick Simulator", description:"Симулятор кирпича — философа", file:"brick_simulator.html", cls:"brick", emoji:"🧱", cover:"covers/brick.jpg", order:"high", unit:"очк." },
  { id:"Chicken War", title:"Chicken War", description:"Бегай, стреляй яйцами, отдыхай", file:"chickenWar.html", cls:"chicken", emoji:"🐔", cover:"covers/chickenWar.jpg", order:"high", unit:"очк." },
  { id:"Iskra", title:"Iskra", description:"Игра про сбор души", file:"iskra.html", cls:"iskra", emoji:"✨", cover:"covers/iskra.jpg", order:"high", unit:"очк." },
  { id:"Chick", title:"Chick", description:"Игра про защиту души", file:"ckick.html", cls:"chick", emoji:"🐤", cover:"covers/chick.jpg", order:"high", unit:"очк." },
  { id:"Tic-tak-toe", title:"Tic-tak-toe", description:"Крестики нолики", file:"tic_tak_toe.html", cls:"ttt", emoji:"❌", cover:"covers/ttt.jpg", order:"high", unit:"побед" },
  { id:"Billiard", title:"Billiard", description:"Биллиард", file:"billiard.html", cls:"billiard", emoji:"🎱", cover:"covers/billiard.jpg", order:"high", unit:"очк." },
  { id:"Crybaby", title:"Crybaby", description:"Плакса", file:"cryBaby.html", cls:"crybaby", emoji:"💧", cover:"covers/crybaby.jpg", order:"high", unit:"очк." },
  { id:"Sudoku", title:"Sudoku", description:"Головоломка с числами", file:"sudoku.html", cls:"sudoku", emoji:"🔢", cover:"covers/sudoku.jpg", order:"low", unit:"сек." },
  { id:"Fast Print", title:"Fast Print", description:"Тренировка скоростной печати для PC и телефонов", file:"fastPrint.html", cls:"fast", emoji:"⌨️", cover:"covers/fastPrint.jpg", order:"high", unit:"зн/мин" }
];

/* ============================================================
   4. СЛОЙ ДАННЫХ (DB) — всё хранение в одном месте
   ОТВЕЧАЕТ ЗА: пользователей, пароли, сессию и рекорды. Только этот объект работает с localStorage.
   Сейчас данные лежат в localStorage браузера. Все методы async,
   поэтому позже их можно заменить на fetch() к серверу (Firebase,
   Supabase, свой API), не трогая остальной код.
   ============================================================ */
const DB = {
  K: { users:"aig_users_v1", records:"aig_records_v1", session:"aig_session_v1" },

  read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  write(key, value)   { localStorage.setItem(key, JSON.stringify(value)); },

  // Хэш пароля: PBKDF2 (если доступен crypto.subtle — https/localhost), иначе простой запасной хэш
  async hash(password, salt) {
    if (window.crypto && crypto.subtle) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt:enc.encode(salt), iterations:100000, hash:"SHA-256" }, key, 256);
      return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    let h = 5381; const s = salt + password;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "fb" + h;
  },

  // ОТВЕЧАЕТ ЗА: кто сейчас вошёл (сохраняется между перезагрузками)
  session() { return this.read(this.K.session, null); },      // {key, name} или null
  logout()  { localStorage.removeItem(this.K.session); },

  // ОТВЕЧАЕТ ЗА: создание аккаунта (проверка логина/пароля, хэш пароля)
  async register(name, password) {
    name = name.trim();
    if (!/^[A-Za-zА-Яа-яЁё0-9_-]{3,20}$/.test(name)) throw new Error("Логин: 3–20 символов, буквы, цифры, _ или -");
    if (password.length < 6) throw new Error("Пароль должен быть не короче 6 символов");
    const users = this.read(this.K.users, {}), key = name.toLowerCase();
    if (users[key]) throw new Error("Такой логин уже занят");
    const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    users[key] = { name, salt, hash: await this.hash(password, salt) };
    this.write(this.K.users, users);
    this.write(this.K.session, { key, name });
    return { key, name };
  },

  // ОТВЕЧАЕТ ЗА: проверку логина и пароля при входе
  async login(name, password) {
    const users = this.read(this.K.users, {}), key = name.trim().toLowerCase(), u = users[key];
    if (!u || u.hash !== await this.hash(password, u.salt)) throw new Error("Неверный логин или пароль");
    this.write(this.K.session, { key, name: u.name });
    return { key, name: u.name };
  },

  // ОТВЕЧАЕТ ЗА: лучший результат пользователя в игре (или null)
  async getBest(userKey, gameId) {
    const r = this.read(this.K.records, {});
    return r[userKey]?.[gameId]?.best ?? null;
  },

  // ОТВЕЧАЕТ ЗА: запись рекорда — только если он лучше прежнего. Возвращает {isRecord, best}
  async submitScore(userKey, game, score) {
    const all = this.read(this.K.records, {});
    all[userKey] = all[userKey] || {};
    const old = all[userKey][game.id]?.best;
    const better = old == null || (game.order === "low" ? score < old : score > old);
    if (better) {
      all[userKey][game.id] = { best: score, date: Date.now() };
      this.write(this.K.records, all);
    }
    return { isRecord: better, best: better ? score : old };
  },

  // ОТВЕЧАЕТ ЗА: список игр, где уже есть хотя бы один рекорд
  async gamesWithRecords() {
    const users = this.read(this.K.users, {}), all = this.read(this.K.records, {}), ids = new Set();
    for (const key in all) if (users[key]) for (const id in all[key]) ids.add(id);
    return [...ids];
  },

  // ОТВЕЧАЕТ ЗА: таблицу лидеров по одной игре: [{name, best}], отсортирована
  async leaderboard(game) {
    const users = this.read(this.K.users, {}), all = this.read(this.K.records, {}), rows = [];
    for (const key in all) {
      const rec = all[key][game.id];
      if (rec && users[key]) rows.push({ key, name: users[key].name, best: rec.best });
    }
    return rows.sort((a, b) => game.order === "low" ? a.best - b.best : b.best - a.best).slice(0, 20);
  }
};

/* ============================================================
   5. ВСПОМОГАТЕЛЬНОЕ: уведомления, окна
   ОТВЕЧАЕТ ЗА: toast(), открытие/закрытие модальных окон, форматирование результата.
   ============================================================ */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
const fmt = (game, n) => `${n} ${game.unit}`;
const openOverlay  = id => $(id).classList.add("open");
const closeOverlays = () => document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open"));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeOverlays));
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeOverlays(); }));

/* ============================================================
   6. ВЕРХНЯЯ ПАНЕЛЬ И АВТОРИЗАЦИЯ
   ОТВЕЧАЕТ ЗА: кто сейчас вошёл (переменная user), вход, регистрацию, выход.
   ============================================================ */
let user = DB.session();   // текущий пользователь: {key, name} или null (гость)
let authMode = "login";    // "login" | "register"

// ОТВЕЧАЕТ ЗА: перерисовку верхней панели (гость / вошедший игрок)
function renderTopbar() {
  const bar = $("topbar");
  bar.innerHTML = `<button class="btn" id="lb-btn">Рекорды</button>` + (user
    ? `<span class="user-chip">${user.name}</span><button class="btn" id="logout-btn">Выйти</button>`
    : `<button class="btn primary" id="login-btn">Войти</button>`);
  $("lb-btn").onclick = openLeaderboard;
  if (user) $("logout-btn").onclick = () => { DB.logout(); user = null; renderTopbar(); refreshBadges(); toast("Вы вышли из аккаунта"); };
  else $("login-btn").onclick = () => openAuth("login");
}

// ОТВЕЧАЕТ ЗА: открытие окна входа
function openAuth(mode) {
  setAuthMode(mode); $("auth-error").textContent = ""; $("auth-pass").value = "";
  openOverlay("auth-overlay"); $("auth-user").focus();
}
function setAuthMode(mode) {
  authMode = mode;
  document.querySelectorAll(".tabs .btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  $("auth-submit").textContent = mode === "login" ? "Войти" : "Создать аккаунт";
  $("auth-pass").autocomplete = mode === "login" ? "current-password" : "new-password";
}
document.querySelectorAll(".tabs .btn").forEach(b => b.addEventListener("click", () => setAuthMode(b.dataset.mode)));

// ОТВЕЧАЕТ ЗА: нажатие «Войти» / «Создать аккаунт», показ ошибок
async function submitAuth() {
  try {
    const name = $("auth-user").value, pass = $("auth-pass").value;
    user = authMode === "login" ? await DB.login(name, pass) : await DB.register(name, pass);
    closeOverlays(); renderTopbar(); refreshBadges();
    toast(`Привет, ${user.name}!`);
  } catch (err) { $("auth-error").textContent = err.message; }
}
$("auth-submit").addEventListener("click", submitAuth);
["auth-user", "auth-pass"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") submitAuth(); }));

/* ============================================================
   7. КАРТОЧКИ ИГР (с картинками вместо эмодзи)
   ОТВЕЧАЕТ ЗА: создание карточек из списка games и подписи «Твой рекорд».
   ============================================================ */
const gamesList = $("games-list");
const badges = {};  // id игры -> элемент «Твой рекорд»

games.forEach(game => {
  const card = document.createElement("article");
  card.className = `game-card ${game.cls}`;
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", `Открыть игру ${game.title}`);
  card.innerHTML = `
    <div class="game-cover"><span>${game.emoji}</span></div>
    <div class="game-info">
      <h3>${game.title}</h3>
      <p>${game.description}</p>
      <div class="best"></div>
      <span class="play" aria-hidden="true">→</span>
    </div>`;

  // Картинка обложки: пока не загрузилась/не найдена — виден эмодзи
  const img = new Image();
  img.alt = ""; img.loading = "lazy";
  img.onload = () => { card.querySelector(".game-cover span").remove(); card.querySelector(".game-cover").appendChild(img); };
  img.src = game.cover;

  badges[game.id] = card.querySelector(".best");
  card.addEventListener("click", () => openGame(game));
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGame(game); } });
  gamesList.appendChild(card);
});

// ОТВЕЧАЕТ ЗА: подписи «Твой рекорд» на карточках (после входа/выхода/нового рекорда)
async function refreshBadges() {
  for (const g of games) {
    const best = user ? await DB.getBest(user.key, g.id) : null;
    badges[g.id].textContent = best != null ? `Твой рекорд: ${fmt(g, best)}` : "";
  }
}

/* ============================================================
   8. ОТКРЫТИЕ / ЗАКРЫТИЕ ИГРЫ
   ОТВЕЧАЕТ ЗА: переключение меню и экрана игры, кнопку «Назад», клавишу Esc.
   ============================================================ */
let currentGame = null;
const frame = $("game-frame");

async function updateGameBest() {
  const best = currentGame && user ? await DB.getBest(user.key, currentGame.id) : null;
  $("game-best").textContent = user ? (best != null ? `Рекорд: ${fmt(currentGame, best)}` : "Рекорда пока нет") : "Гость: рекорды не сохраняются";
}

// ОТВЕЧАЕТ ЗА: запуск выбранной игры в iframe
function openGame(game) {
  currentGame = game;
  $("menu").style.display = "none";
  $("game-screen").style.display = "flex";
  $("game-title").textContent = game.title;
  frame.src = game.file;
  document.body.style.overflow = "hidden";
  updateGameBest();
  if (!user) toast("Войдите, чтобы сохранять рекорды");
}

// ОТВЕЧАЕТ ЗА: возврат в меню и обновление рекордов на карточках
function closeGame() {
  currentGame = null;
  $("game-screen").style.display = "none";
  $("menu").style.display = "block";
  frame.src = "";
  document.body.style.overflow = "";
  refreshBadges();
}
$("back-btn").addEventListener("click", closeGame);

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".overlay.open")) closeOverlays();
  else if (currentGame) closeGame();
});

/* ============================================================
   9. ПРИЁМ РЕКОРДОВ ИЗ ИГР
   ОТВЕЧАЕТ ЗА: получение счёта от игры и его сохранение через DB.submitScore().
   Игра внутри iframe отправляет счёт сообщением (см. инструкцию
   после кода). Лаунчер сам понимает, какая игра открыта, поэтому
   игра не может записать счёт в чужую игру.
   ============================================================ */
// ОТВЕЧАЕТ ЗА: проверку и сохранение счёта, пришедшего из игры
window.addEventListener("message", async e => {
  if (!currentGame || e.source !== frame.contentWindow) return;   // только от открытой игры
  const d = e.data;
  if (!d || d.type !== "aigames:score") return;
  const score = Number(d.score);
  if (!Number.isFinite(score) || score < 0) return;
  if (!user) return;                                              // гости не сохраняют
  const res = await DB.submitScore(user.key, currentGame, score);
  if (res.isRecord) { toast(`Новый рекорд: ${fmt(currentGame, score)}`); updateGameBest(); }
});

/* ============================================================
   10. ТАБЛИЦА РЕКОРДОВ
   ОТВЕЧАЕТ ЗА: окно рекордов. Изначально пустое; игры и игроки появляются по мере рекордов.
   ============================================================ */
$("lb-game").addEventListener("change", renderLeaderboard);

// ОТВЕЧАЕТ ЗА: открытие окна рекордов. В выпадающем списке только те игры,
// в которых уже есть хотя бы один рекорд. Если рекордов нет вообще — список скрыт.
async function openLeaderboard() {
  const withRecords = await DB.gamesWithRecords(), sel = $("lb-game"), prev = sel.value;
  sel.innerHTML = games.map((g, i) => withRecords.includes(g.id) ? `<option value="${i}">${g.title}</option>` : "").join("");
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  sel.parentElement.style.display = withRecords.length ? "" : "none";
  openOverlay("lb-overlay"); renderLeaderboard();
}

// ОТВЕЧАЕТ ЗА: отрисовку таблицы выбранной игры (или пустого состояния)
async function renderLeaderboard() {
  const body = $("lb-body");
  if (!$("lb-game").options.length) { body.innerHTML = `<div class="empty">Рекордов пока нет. Они появятся, как только кто-нибудь начнёт играть.</div>`; return; }
  const game = games[$("lb-game").value], rows = await DB.leaderboard(game);
  if (!rows.length) { body.innerHTML = `<div class="empty">Здесь пока пусто. Сыграйте первым.</div>`; return; }
  body.innerHTML = `<table><tr><th>#</th><th>Игрок</th><th>Результат</th></tr>` +
    rows.map((r, i) => `<tr class="${user && r.key === user.key ? "me" : ""}"><td>${i + 1}</td><td>${r.name}</td><td>${fmt(game, r.best)}</td></tr>`).join("") + `</table>`;
}

/* ============================================================
   11. СТАРТ
   ОТВЕЧАЕТ ЗА: первый запуск страницы (рисует панель и подписи рекордов).
   ============================================================ */
renderTopbar();
refreshBadges();

/* ------------------------------------------------------------
   КАК ПОДКЛЮЧИТЬ РЕКОРДЫ В КАЖДОЙ ИГРЕ
   В файле игры (snake.html и т.д.) в момент конца игры добавь:

     window.parent.postMessage({ type: "aigames:score", score: score }, "*");

   где score — переменная с результатом. Для игр с order:"low"
   (Sudoku) отправляй время в секундах. Отправлять можно сколько
   угодно раз: лаунчер сохранит только лучший результат.
   ------------------------------------------------------------ */
</script>
</body>
</html>
