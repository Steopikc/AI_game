<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b2b">
  <title>ИИТД — AI Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a27;
      --panel: rgba(11, 17, 55, .76);
      --panel-strong: rgba(9, 14, 42, .92);
      --text: #fff;
      --muted: #b9c1e8;
      --cyan: #53e8ff;
      --violet: #9a5cff;
      --pink: #ff4fcf;
      --line: rgba(255,255,255,.12);
    }

    html, body { min-height: 100%; }

    body {
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(119, 54, 255, .22), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(35, 112, 255, .20), transparent 30%),
        #060a27;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(180deg, rgba(5,8,34,.20), rgba(5,8,34,.72)),
        url("сайтФон.png") center / cover no-repeat;
      opacity: .82;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      right: -190px;
      bottom: -260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(58, 87, 255, .42), rgba(85, 32, 255, .08) 52%, transparent 70%);
      filter: blur(8px);
      z-index: -2;
      pointer-events: none;
    }

    button, .game-card { -webkit-tap-highlight-color: transparent; }

    #menu {
      width: min(1260px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0 70px;
    }

    header {
      position: relative;
      text-align: center;
      padding: 8px 0 34px;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: .92;
      position: relative;
      z-index: 1;
    }

    .brand-small {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -.05em;
      color: #fff;
      text-shadow: 0 8px 30px rgba(70, 98, 255, .3);
    }

    .brand-main {
      margin-top: 5px;
      font-size: clamp(3rem, 6vw, 5.8rem);
      font-weight: 950;
      letter-spacing: -.07em;
      background: linear-gradient(90deg, #ff4fd8 0%, #9c5cff 42%, #4de7ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 26px rgba(104, 73, 255, .28));
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(1rem, 2vw, 1.35rem);
      color: #d7dcff;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .decor {
      position: absolute;
      border-radius: 999px;
      filter: blur(.2px);
      pointer-events: none;
    }

    .decor.one {
      width: 110px; height: 110px;
      left: -20px; top: 0;
      background: radial-gradient(circle at 35% 35%, #6c5cff, #2c38d8 55%, transparent 72%);
      opacity: .7;
    }

    .decor.two {
      width: 150px; height: 150px;
      right: -25px; top: 0;
      background: radial-gradient(circle at 60% 40%, #5ceaff, #3450d8 48%, transparent 70%);
      opacity: .55;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .game-card {
      --accent: #7b5cff;
      position: relative;
      min-height: 235px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--accent) 65%, white 10%);
      border-radius: 22px;
      background: rgba(9, 15, 47, .78);
      box-shadow:
        0 16px 38px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
      isolation: isolate;
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 36%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 32%, #101741), #07102f 72%);
      opacity: .9;
    }

    .game-card::after {
      content: "";
      position: absolute;
      width: 170px; height: 170px;
      right: -80px; top: -80px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 32%, transparent);
      filter: blur(18px);
      z-index: -1;
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.012);
      border-color: var(--accent);
      box-shadow:
        0 22px 55px rgba(0,0,0,.36),
        0 0 30px color-mix(in srgb, var(--accent) 25%, transparent),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .game-cover {
      height: 150px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 5.2rem;
      background:
        radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 52%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 38%, #0b1135), #07102d);
    }

    .game-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(125deg, transparent 20%, rgba(255,255,255,.10) 21%, transparent 22%),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.12) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 65%, rgba(255,255,255,.10) 0 2px, transparent 3px);
      opacity: .8;
    }

    .game-cover span {
      position: relative;
      z-index: 1;
      transform: translateY(-2px);
      filter: drop-shadow(0 12px 12px rgba(0,0,0,.3));
      transition: transform .3s ease;
    }

    .game-card:hover .game-cover span {
      transform: translateY(-5px) scale(1.08) rotate(-2deg);
    }

    .game-info {
      position: relative;
      min-height: 85px;
      padding: 14px 15px 15px;
      background: linear-gradient(180deg, rgba(5,10,31,.74), rgba(5,9,28,.94));
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .game-info h3 {
      padding-right: 38px;
      color: #fff;
      font-size: 1.06rem;
      font-weight: 850;
      letter-spacing: -.015em;
      margin-bottom: 5px;
    }

    .game-info p {
      color: #b9c3e8;
      font-size: .84rem;
      line-height: 1.35;
      padding-right: 25px;
    }

    .play {
      position: absolute;
      right: 13px;
      top: 17px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: color-mix(in srgb, var(--accent) 75%, #111 25%);
      box-shadow: 0 5px 18px color-mix(in srgb, var(--accent) 30%, transparent);
      font-size: 18px;
      font-weight: 900;
    }

    /* Цвета карточек */
    .soul { --accent: #d83cff; }
    .snake { --accent: #25e99b; }
    .space { --accent: #6cff39; }
    .ping { --accent: #a452ff; }
    .brick { --accent: #2f8dff; }
    .chicken { --accent: #21d7ee; }
    .iskra { --accent: #7358ff; }
    .chick { --accent: #ffb72d; }
    .ttt { --accent: #ff4caa; }
    .billiard { --accent: #ffc72f; }
    .crybaby { --accent: #46b8ff; }

    /* Экран игры */
    #game-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      flex-direction: column;
      background: #02040d;
    }

    #game-header {
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      background: linear-gradient(90deg, rgba(8,11,39,.98), rgba(17,10,54,.98));
      border-bottom: 1px solid rgba(111, 101, 255, .35);
      box-shadow: 0 8px 28px rgba(0,0,0,.35);
    }

    #back-btn {
      border: 1px solid rgba(91, 228, 255, .6);
      border-radius: 12px;
      padding: 9px 15px;
      color: #fff;
      background: rgba(32, 43, 105, .75);
      cursor: pointer;
      font-size: .92rem;
      font-weight: 700;
      transition: .2s ease;
    }

    #back-btn:hover {
      background: linear-gradient(90deg, #7a4dff, #2bdfff);
      border-color: transparent;
      transform: translateY(-1px);
    }

    #game-title {
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
    }

    #game-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #000;
    }

    @media (max-width: 1050px) {
      .games-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      #menu { width: min(100% - 24px, 600px); padding-top: 22px; }
      header { padding-bottom: 24px; }
      .decor { display: none; }
      .games-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
      .game-card { min-height: 215px; border-radius: 18px; }
      .game-cover { height: 130px; font-size: 4.2rem; }
      .game-info { padding: 12px; }
    }

    @media (max-width: 470px) {
      .games-grid { grid-template-columns: 1fr; }
      .game-card { min-height: 210px; }
      .game-cover { height: 135px; }
    }
  </style>
</head>
<body>

  <main id="menu">
    <header>
      <div class="decor one"></div>
      <div class="decor two"></div>

      <div class="brand">
        <div class="brand-small">ИИТД</div>
        <div class="brand-main">AI Games</div>
        <div class="subtitle">Игры на любой вкус</div>
      </div>
    </header>

    <section class="games-grid" id="games-list" aria-label="Список игр"></section>
  </main>

  <section id="game-screen" aria-label="Открытая игра">
    <div id="game-header">
      <button id="back-btn" onclick="closeGame()">← Назад в меню</button>
      <div id="game-title"></div>
    </div>
    <iframe id="game-frame" src="" allowfullscreen title="Игра"></iframe>
  </section>

  <script>
    const games = [
      { id: "SoulBound", title: "SoulBound", description: "Игра про защиту души", file: "soulbound.html", cls: "soul", emoji: "👻" },
      { id: "Snake", title: "Snake", description: "Обычная змейка", file: "snake.html", cls: "snake", emoji: "🐍" },
      { id: "Space Jumper", title: "Space Jumper", description: "Прыгающий квадрат", file: "jumpingSquare.html", cls: "space", emoji: "🟪" },
      { id: "PinPong", title: "PinPong", description: "Игра в пинг-понг на двоих", file: "pinpong.html", cls: "ping", emoji: "🏓" },
      { id: "Brick Simulator", title: "Brick Simulator", description: "Симулятор кирпича — философа", file: "brick_simulator.html", cls: "brick", emoji: "🧱" },
      { id: "Chicken War", title: "Chicken War", description: "Бегай, стреляй яйцами, отдыхай", file: "chickenWar.html", cls: "chicken", emoji: "🐔" },
      { id: "Iskra", title: "Iskra", description: "Игра про сбор души", file: "iskra.html", cls: "iskra", emoji: "✡️" },
      { id: "Chick", title: "Chick", description: "Игра про защиту души", file: "ckick.html", cls: "chick", emoji: "🐤" },
      { id: "Tic-tak-toe", title: "Tic-tak-toe", description: "Крестики нолики", file: "tic_tak_toe.html", cls: "ttt", emoji: "❌" },
      { id: "Billiard", title: "Billiard", description: "Биллиард", file: "billiard.html", cls: "billiard", emoji: "🎱" },
      { id: "Crybaby", title: "Crybaby", description: "Плакса", file: "cryBaby.html", cls: "crybaby", emoji: "💧" }
    ];

    const gamesList = document.getElementById("games-list");

    games.forEach(game => {
      const card = document.createElement("article");
      card.className = `game-card ${game.cls}`;
      card.setAttribute("tabindex", "0");
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `Открыть игру ${game.title}`);

      card.innerHTML = `
        <div class="game-cover">
          <span>${game.emoji}</span>
        </div>
        <div class="game-info">
          <h3>${game.title}</h3>
          <p>${game.description}</p>
          <span class="play" aria-hidden="true">→</span>
        </div>
      `;

      card.addEventListener("click", () => openGame(game));
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openGame(game);
        }
      });

      gamesList.appendChild(card);
    });

    function openGame(game) {
      document.getElementById("menu").style.display = "none";
      document.getElementById("game-screen").style.display = "flex";
      document.getElementById("game-title").textContent = game.title;
      document.getElementById("game-frame").src = game.file;
      document.body.style.overflow = "hidden";
    }

    function closeGame() {
      document.getElementById("game-screen").style.display = "none";
      document.getElementById("menu").style.display = "block";
      document.getElementById("game-frame").src = "";
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeGame();
    });
  </script>
</body>
</html>
