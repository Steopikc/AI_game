<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #3fb950;
    }
    #score {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #8b949e;
    }
    #score span { color: #58a6ff; font-weight: 600; }
    canvas {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(63, 185, 80, 0.15);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 2rem; color: #f85149; }
    #overlay p { color: #8b949e; }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    .controls {
      margin-top: 18px;
      color: #8b949e;
      font-size: 0.9rem;
      text-align: center;
    }
    .mobile-controls {
      display: none;
      margin-top: 20px;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 200px;
    }
    .mobile-controls button {
      width: 56px;
      height: 56px;
      font-size: 1.4rem;
      padding: 0;
      background: #21262d;
      border: 1px solid #30363d;
    }
    @media (max-width: 500px) {
      .mobile-controls { display: flex; }
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <h1>🐍 Змейка</h1>
  <div id="score">Счёт: <span id="score-val">0</span></div>
  <div style="position: relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Змейка</h2>
      <p id="overlay-msg">Нажми «Старт» или пробел</p>
      <button id="start-btn">Старт</button>
    </div>
  </div>
  <div class="controls">Управление: стрелки или WASD · Пауза: Пробел</div>
  <div class="mobile-controls">
    <button onclick="setDir(0,-1)">↑</button>
    <div style="width:100%;display:flex;gap:8px;justify-content:center;">
      <button onclick="setDir(-1,0)">←</button>
      <button onclick="setDir(0,1)">↓</button>
      <button onclick="setDir(1,0)">→</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-val');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const CELL = canvas.width / GRID;

    let snake, dir, nextDir, food, score, gameLoop, running, paused;

    function reset() {
      snake = [{x: 10, y: 10}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      food = spawnFood();
      score = 0;
      scoreEl.textContent = score;
      running = false;
      paused = false;
    }

    function spawnFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    function setDir(dx, dy) {
      if (!running || paused) return;
      // prevent reverse
      if (dx === -dir.x && dy === -dir.y) return;
      nextDir = {x: dx, y: dy};
    }

    function update() {
      if (!running || paused) return;

      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        gameOver();
        return;
      }
      // self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        food = spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // grid
      ctx.strokeStyle = '#21262d';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // food
      ctx.fillStyle = '#f85149';
      ctx.beginPath();
      ctx.roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
      ctx.fill();

      // snake
      snake.forEach((s, i) => {
        const alpha = 1 - (i / snake.length) * 0.5;
        ctx.fillStyle = `rgba(63, 185, 80, ${alpha})`;
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
        ctx.fill();
      });
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'Игра окончена';
      overlayMsg.textContent = `Счёт: ${score}`;
      startBtn.textContent = 'Ещё раз';
      overlay.classList.remove('hidden');
    }

    function startGame() {
      reset();
      running = true;
      overlay.classList.add('hidden');
      clearInterval(gameLoop);
      gameLoop = setInterval(() => {
        update();
        draw();
      }, 110);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = 'Пауза';
        overlayMsg.textContent = 'Нажми пробел чтобы продолжить';
        startBtn.textContent = 'Продолжить';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
      }
    }

    startBtn.addEventListener('click', () => {
      if (paused) {
        paused = false;
        overlay.classList.add('hidden');
      } else {
        startGame();
      }
    });

    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (key === ' ' || key === 'spacebar') {
        e.preventDefault();
        if (!running) startGame();
        else togglePause();
        return;
      }
      if (key === 'arrowup' || key === 'w') setDir(0, -1);
      if (key === 'arrowdown' || key === 's') setDir(0, 1);
      if (key === 'arrowleft' || key === 'a') setDir(-1, 0);
      if (key === 'arrowright' || key === 'd') setDir(1, 0);
    });

    // initial draw
    reset();
    draw();
  </script>
</body>
</html>
