
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>🐍 Змейка</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      user-select: none;
      touch-action: none;
    }

    h1 {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      margin-bottom: 6px;
      color: #3fb950;
    }

    #score {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      margin-bottom: 10px;
      color: #8b949e;
    }

    #score span {
      color: #58a6ff;
      font-weight: 700;
    }

    /* Игровой контейнер */

    #game-wrapper {
      position: relative;

      width: min(
        92vw,
        72vh,
        600px
      );

      aspect-ratio: 1 / 1;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;

      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 10px;

      box-shadow:
        0 0 30px rgba(63, 185, 80, 0.15);

      touch-action: none;
    }

    /* Оверлей */

    #overlay {
      position: absolute;
      inset: 0;

      background: rgba(13, 17, 23, 0.90);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 14px;

      border-radius: 10px;

      z-index: 10;
    }

    #overlay.hidden {
      display: none;
    }

    #overlay h2 {
      font-size: clamp(1.5rem, 7vw, 2.2rem);
      color: #f85149;
      text-align: center;
    }

    #overlay p {
      color: #8b949e;
      text-align: center;
      padding: 0 20px;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;

      background: #238636;

      border-radius: 12px;

      font-size: 1rem;
      font-weight: 600;

      transition:
        transform 0.1s,
        background 0.15s;
    }

    button:active {
      transform: scale(0.92);
    }

    #start-btn {
      padding: 13px 30px;
      min-width: 150px;
    }

    #start-btn:hover {
      background: #2ea043;
    }

    /* Управление */

    .controls {
      margin-top: 10px;

      color: #8b949e;

      font-size: 0.85rem;

      text-align: center;
    }

    /* Мобильный контроллер */

    .mobile-controls {
      display: none;

      margin-top: 12px;

      width: min(90vw, 300px);

      position: relative;

      touch-action: none;
    }

    .control-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .mobile-controls button {
      width: clamp(58px, 17vw, 76px);
      height: clamp(52px, 15vw, 70px);

      background: #21262d;
      border: 1px solid #30363d;

      font-size: clamp(1.4rem, 5vw, 2rem);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-controls button:active {
      background: #30363d;
    }

    /* Кнопка паузы */

    #pause-btn {
      display: none;

      margin-top: 10px;

      width: min(90vw, 300px);
      height: 48px;

      background: #21262d;
      border: 1px solid #30363d;
    }

    #pause-btn:active {
      background: #30363d;
    }

    /*
      Телефоны и планшеты
    */

    @media (max-width: 900px), (pointer: coarse) {

      .mobile-controls {
        display: block;
      }

      #pause-btn {
        display: block;
      }

      .controls {
        display: none;
      }

      #game-wrapper {
        width: min(
          92vw,
          60vh,
          600px
        );
      }
    }

    /*
      Очень маленькие телефоны
    */

    @media (max-height: 650px) and (pointer: coarse) {

      h1 {
        margin-bottom: 2px;
      }

      #score {
        margin-bottom: 4px;
      }

      .mobile-controls {
        margin-top: 5px;
      }

      #pause-btn {
        margin-top: 5px;
        height: 42px;
      }
    }

    /*
      Планшет в альбомной ориентации
    */

    @media (orientation: landscape) and (pointer: coarse) {

      body {
        flex-direction: row;
        flex-wrap: wrap;
        align-content: center;
        gap: 8px 20px;
      }

      h1 {
        width: 100%;
        text-align: center;
      }

      #score {
        width: 100%;
        text-align: center;
      }

      #game-wrapper {
        width: min(60vh, 600px);
      }

      .mobile-controls {
        width: 180px;
        margin-top: 0;
      }

      #pause-btn {
        width: 180px;
      }
    }
  </style>
</head>

<body>

  <h1>🐍 Змейка</h1>

  <div id="score">
    Счёт: <span id="score-val">0</span>
  </div>

  <div id="game-wrapper">

    <canvas id="canvas"
            width="400"
            height="400">
    </canvas>

    <div id="overlay">

      <h2 id="overlay-title">
        🐍 Змейка
      </h2>

      <p id="overlay-msg">
        Нажми «Старт» или пробел
      </p>

      <button id="start-btn">
        Старт
      </button>

    </div>

  </div>

  <!-- Управление для телефона / планшета -->

  <div class="mobile-controls">

    <div class="control-row">
      <button data-dir="up">▲</button>
    </div>

    <div class="control-row">
      <button data-dir="left">◀</button>

      <button data-dir="down">▼</button>

      <button data-dir="right">▶</button>
    </div>

  </div>

  <button id="pause-btn">
    ⏸ Пауза
  </button>


<script>

  const canvas =
    document.getElementById('canvas');

  const ctx =
    canvas.getContext('2d');

  const scoreEl =
    document.getElementById('score-val');

  const overlay =
    document.getElementById('overlay');

  const overlayTitle =
    document.getElementById('overlay-title');

  const overlayMsg =
    document.getElementById('overlay-msg');

  const startBtn =
    document.getElementById('start-btn');

  const pauseBtn =
    document.getElementById('pause-btn');


  /* =========================
     НАСТРОЙКИ
  ========================= */

  const GRID = 20;

  const CELL =
    canvas.width / GRID;


  /* =========================
     ПЕРЕМЕННЫЕ
  ========================= */

  let snake;
  let dir;
  let nextDir;
  let food;
  let score;

  let gameLoop = null;

  let running = false;
  let paused = false;


  /* =========================
     СБРОС
  ========================= */

  function reset() {

    snake = [
      { x: 10, y: 10 }
    ];

    dir = {
      x: 1,
      y: 0
    };

    nextDir = {
      x: 1,
      y: 0
    };

    score = 0;

    scoreEl.textContent = score;

    food = spawnFood();

    running = false;
    paused = false;
  }


  /* =========================
     ЕДА
  ========================= */

  function spawnFood() {

    let pos;

    do {

      pos = {
        x: Math.floor(
          Math.random() * GRID
        ),

        y: Math.floor(
          Math.random() * GRID
        )
      };

    } while (
      snake.some(
        s =>
          s.x === pos.x &&
          s.y === pos.y
      )
    );

    return pos;
  }


  /* =========================
     УПРАВЛЕНИЕ
  ========================= */

  function setDir(dx, dy) {

    if (!running || paused)
      return;

    /*
      Нельзя развернуться
      прямо в противоположную сторону
    */

    if (
      dx === -dir.x &&
      dy === -dir.y
    ) {
      return;
    }

    nextDir = {
      x: dx,
      y: dy
    };
  }


  /* =========================
     ОБНОВЛЕНИЕ ИГРЫ
  ========================= */

  function update() {

    if (!running || paused)
      return;

    dir = nextDir;

    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };


    /* Стена */

    if (
      head.x < 0 ||
      head.x >= GRID ||
      head.y < 0 ||
      head.y >= GRID
    ) {

      gameOver();

      return;
    }


    /* Столкновение с собой */

    if (
      snake.some(
        s =>
          s.x === head.x &&
          s.y === head.y
      )
    ) {

      gameOver();

      return;
    }


    snake.unshift(head);


    /* Еда */

    if (
      head.x === food.x &&
      head.y === food.y
    ) {

      score += 10;

      scoreEl.textContent = score;

      food = spawnFood();

    } else {

      snake.pop();

    }
  }


  /* =========================
     ОТРИСОВКА
  ========================= */

  function draw() {

    ctx.fillStyle = '#161b22';

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* Сетка */

    ctx.strokeStyle = '#21262d';

    ctx.lineWidth = 0.5;

    for (
      let i = 0;
      i <= GRID;
      i++
    ) {

      ctx.beginPath();

      ctx.moveTo(
        i * CELL,
        0
      );

      ctx.lineTo(
        i * CELL,
        canvas.height
      );

      ctx.stroke();


      ctx.beginPath();

      ctx.moveTo(
        0,
        i * CELL
      );

      ctx.lineTo(
        canvas.width,
        i * CELL
      );

      ctx.stroke();
    }


    /* Еда */

    ctx.fillStyle = '#f85149';

    ctx.beginPath();

    ctx.roundRect(
      food.x * CELL + 2,
      food.y * CELL + 2,
      CELL - 4,
      CELL - 4,
      5
    );

    ctx.fill();


    /* Змейка */

    snake.forEach((s, i) => {

      const alpha =
        1 - (i / snake.length) * 0.5;

      ctx.fillStyle =
        `rgba(63,185,80,${alpha})`;

      ctx.beginPath();

      ctx.roundRect(
        s.x * CELL + 1,
        s.y * CELL + 1,
        CELL - 2,
        CELL - 2,
        4
      );

      ctx.fill();

    });
  }


  /* =========================
     КОНЕЦ ИГРЫ
  ========================= */

  function gameOver() {

    running = false;

    clearInterval(gameLoop);

    overlayTitle.textContent =
      '💥 Игра окончена';

    overlayMsg.textContent =
      `Счёт: ${score}`;

    startBtn.textContent =
      '🔄 Ещё раз';

    overlay.classList.remove(
      'hidden'
    );

    pauseBtn.textContent =
      '⏸ Пауза';
  }


  /* =========================
     СТАРТ
  ========================= */

  function startGame() {

    reset();

    running = true;

    overlay.classList.add(
      'hidden'
    );

    pauseBtn.textContent =
      '⏸ Пауза';

    clearInterval(gameLoop);

    gameLoop = setInterval(
      () => {

        update();
        draw();

      },
      110
    );
  }


  /* =========================
     ПАУЗА
  ========================= */

  function togglePause() {

    if (!running)
      return;

    paused = !paused;


    if (paused) {

      overlayTitle.textContent =
        '⏸ Пауза';

      overlayMsg.textContent =
        'Нажми кнопку ниже или пробел';

      startBtn.textContent =
        '▶ Продолжить';

      overlay.classList.remove(
        'hidden'
      );

      pauseBtn.textContent =
        '▶ Продолжить';

    } else {

      overlay.classList.add(
        'hidden'
      );

      pauseBtn.textContent =
        '⏸ Пауза';
    }
  }


  /* =========================
     КНОПКА СТАРТ
  ========================= */

  startBtn.addEventListener(
    'click',
    () => {

      if (paused) {

        paused = false;

        overlay.classList.add(
          'hidden'
        );

        pauseBtn.textContent =
          '⏸ Пауза';

      } else {

        startGame();

      }

    }
  );


  /* =========================
     КНОПКА ПАУЗЫ
  ========================= */

  pauseBtn.addEventListener(
    'click',
    togglePause
  );


  /* =========================
     КЛАВИАТУРА ПК
  ========================= */

  document.addEventListener(
    'keydown',
    e => {

      const key =
        e.key.toLowerCase();


      if (
        key === ' ' ||
        key === 'spacebar'
      ) {

        e.preventDefault();

        if (!running) {

          startGame();

        } else {

          togglePause();

        }

        return;
      }


      if (
        key === 'arrowup' ||
        key === 'w'
      ) {

        e.preventDefault();

        setDir(0, -1);
      }


      if (
        key === 'arrowdown' ||
        key === 's'
      ) {

        e.preventDefault();

        setDir(0, 1);
      }


      if (
        key === 'arrowleft' ||
        key === 'a'
      ) {

        e.preventDefault();

        setDir(-1, 0);
      }


      if (
        key === 'arrowright' ||
        key === 'd'
      ) {

        e.preventDefault();

        setDir(1, 0);
      }

    }
  );


  /* =========================
     СЕНСОРНЫЕ КНОПКИ
  ========================= */

  const buttons =
    document.querySelectorAll(
      '.mobile-controls button'
    );


  buttons.forEach(button => {

    button.addEventListener(
      'pointerdown',
      e => {

        e.preventDefault();

        const direction =
          button.dataset.dir;


        if (direction === 'up')
          setDir(0, -1);

        if (direction === 'down')
          setDir(0, 1);

        if (direction === 'left')
          setDir(-1, 0);

        if (direction === 'right')
          setDir(1, 0);

      }
    );

  });


  /* =========================
     СВАЙПЫ ПО ПОЛЮ
  ========================= */

  let touchStartX = 0;
  let touchStartY = 0;


  canvas.addEventListener(
    'pointerdown',
    e => {

      touchStartX = e.clientX;
      touchStartY = e.clientY;

    }
  );


  canvas.addEventListener(
    'pointerup',
    e => {

      const dx =
        e.clientX - touchStartX;

      const dy =
        e.clientY - touchStartY;


      const minSwipe = 25;


      if (
        Math.abs(dx) < minSwipe &&
        Math.abs(dy) < minSwipe
      ) {

        return;
      }


      if (
        Math.abs(dx) >
        Math.abs(dy)
      ) {

        if (dx > 0)
          setDir(1, 0);
        else
          setDir(-1, 0);

      } else {

        if (dy > 0)
          setDir(0, 1);
        else
          setDir(0, -1);

      }

    }
  );


  /* =========================
     ПЕРВОНАЧАЛЬНЫЙ ЗАПУСК
  ========================= */

  reset();

  draw();

</script>

</body>
</html>
```
