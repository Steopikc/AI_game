<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судоку — AI Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #111217;
            --bg-secondary: #181a21;
            --card: #1b1d24;
            --card-hover: #22242d;

            --text: #f2f2f5;
            --muted: #9699a8;

            --border: #30333e;
            --border-strong: #4a4d5b;

            --cell: #20222a;
            --given: #292c35;
            --selected: #37325f;
            --same-number: #302b50;

            --primary: #756cff;
            --primary-dark: #6158e8;

            --success: #42c77a;
            --danger: #ef5350;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #20222b 0%,
                    #15161c 45%,
                    #0e0f13 100%
                );
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            transition: background 0.2s ease;
        }

        body.error-flash {
            animation: errorFlash 0.55s ease;
        }

        @keyframes errorFlash {
            0% {
                box-shadow:
                    inset 0 0 0 0 rgba(239, 83, 80, 0);
            }

            25% {
                box-shadow:
                    inset 0 0 65px 15px rgba(239, 83, 80, 0.42);
            }

            100% {
                box-shadow:
                    inset 0 0 0 0 rgba(239, 83, 80, 0);
            }
        }

        .game {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .header {
            margin-bottom: 22px;
        }

        .logo {
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 6vw, 44px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        .game-card {
            background: rgba(27, 29, 36, 0.96);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .difficulty {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .difficulty button {
            border: none;
            background: #252730;
            color: #a5a7b5;
            padding: 10px 17px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .difficulty button:hover {
            background: #30323d;
            color: #e8e8ed;
        }

        .difficulty button.active {
            background: var(--primary);
            color: white;
            box-shadow:
                0 5px 18px rgba(117, 108, 255, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto 17px;
            max-width: 500px;
            font-size: 15px;
            color: var(--muted);
        }

        .errors {
            color: var(--text);
            font-weight: 600;
        }

        .error-count {
            color: var(--danger);
            font-size: 17px;
        }

        .sudoku {
            width: min(100%, 500px);
            aspect-ratio: 1;
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);

            background: #08090c;
            border: 3px solid #555867;
            border-radius: 10px;
            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .cell {
            position: relative;

            border: 1px solid #393c47;
            background: var(--cell);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: clamp(18px, 4vw, 27px);
            font-weight: 500;

            cursor: pointer;
            user-select: none;

            transition:
                background 0.12s ease,
                color 0.12s ease;
        }

        /* Более толстые линии между блоками 3x3 */

        .cell:nth-child(3n) {
            border-right: 2px solid var(--border-strong);
        }

        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid var(--border-strong);
        }

        .cell:nth-child(n+73) {
            border-bottom: none;
        }

        .cell.given {
            background: var(--given);
            color: #eeeeF2;
            font-weight: 800;
            cursor: default;
        }

        .cell.selected {
            background: var(--selected) !important;
        }

        .cell.same-number {
            background: var(--same-number) !important;
        }

        .cell.user-number {
            color: #8b83ff;
            font-weight: 700;
        }

        .cell.selected.user-number {
            color: #a39dff;
        }

        .number-panel {
            margin: 22px auto 0;
            width: min(100%, 500px);
        }

        .number-title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 9px;
        }

        .numbers {
            display: flex;
            flex-wrap: nowrap;
            gap: 6px;
            justify-content: center;
        }

        .number-btn {
            flex: 1;
            min-width: 0;
            aspect-ratio: 1 / 1;

            border: 1px solid #383b47;
            background: #24262f;
            color: #eeeeF2;

            border-radius: 10px;

            font-size: clamp(16px, 4vw, 21px);
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.12s ease,
                background 0.12s ease,
                border-color 0.12s ease,
                color 0.12s ease;
        }

        .number-btn:hover {
            background: #34313f;
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .number-btn:active {
            transform: scale(0.94);
        }

        .number-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 12px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            transition: 0.2s;
        }

        .new-game {
            background: var(--primary);
            color: white;

            box-shadow:
                0 6px 18px rgba(117, 108, 255, 0.25);
        }

        .new-game:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .clear-btn {
            background: #292b34;
            color: #b5b7c2;
        }

        .clear-btn:hover {
            background: #343640;
            color: white;
        }

        .message {
            min-height: 22px;
            margin-top: 13px;

            font-size: 14px;
            font-weight: 600;
        }

        .message.success {
            color: var(--success);
        }

        .message.error {
            color: var(--danger);
        }

        .message.info {
            color: var(--muted);
        }

        .footer {
            margin-top: 17px;
            font-size: 12px;
            color: #656875;
        }

        /* Окно окончания игры */

        .game-over {
            position: fixed;
            inset: 0;

            background: rgba(5, 6, 9, 0.72);

            display: none;
            justify-content: center;
            align-items: center;

            padding: 20px;
            z-index: 10;

            backdrop-filter: blur(5px);
        }

        .game-over.show {
            display: flex;
        }

        .game-over-card {
            width: min(100%, 380px);

            background: #1d1f27;
            border: 1px solid #343742;

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55);
        }

        .game-over-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .game-over h2 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .game-over p {
            color: var(--muted);
            margin: 0 0 20px;
            line-height: 1.5;
        }

        .restart-btn {
            border: none;

            background: var(--primary);
            color: white;

            padding: 12px 22px;

            border-radius: 12px;

            font-weight: 700;
            cursor: pointer;

            transition: 0.2s;
        }

        .restart-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        @media (max-width: 520px) {

            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .game-card {
                padding: 15px;
                border-radius: 18px;
            }

            .difficulty button {
                padding: 9px 10px;
                font-size: 13px;
            }

            .stats {
                padding: 0 3px;
            }

            .numbers {
                gap: 4px;
            }

            .number-btn {
                border-radius: 8px;
            }

            .actions {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="logo">ИИТД — AI Games</div>

        <h1>Судоку</h1>

        <p class="subtitle">
            Заполни все клетки и не допусти 3 ошибки
        </p>
    </div>


    <div class="game-card">

        <div class="difficulty">

            <button
                data-difficulty="easy"
                class="active">
                Лёгкий
            </button>

            <button
                data-difficulty="medium">
                Средний
            </button>

            <button
                data-difficulty="hard">
                Сложный
            </button>

        </div>


        <div class="stats">

            <div>
                Уровень:
                <strong id="difficultyName">
                    Лёгкий
                </strong>
            </div>

            <div class="errors">
                Ошибки:

                <span
                    id="errorCount"
                    class="error-count">
                    0
                </span>

                / 3
            </div>

        </div>


        <div id="sudoku" class="sudoku"></div>


        <div class="number-panel">

            <div class="number-title">
                Выбери клетку, затем цифру
            </div>

            <div id="numbers" class="numbers">

                <button
                    class="number-btn"
                    data-number="1">
                    1
                </button>

                <button
                    class="number-btn"
                    data-number="2">
                    2
                </button>

                <button
                    class="number-btn"
                    data-number="3">
                    3
                </button>

                <button
                    class="number-btn"
                    data-number="4">
                    4
                </button>

                <button
                    class="number-btn"
                    data-number="5">
                    5
                </button>

                <button
                    class="number-btn"
                    data-number="6">
                    6
                </button>

                <button
                    class="number-btn"
                    data-number="7">
                    7
                </button>

                <button
                    class="number-btn"
                    data-number="8">
                    8
                </button>

                <button
                    class="number-btn"
                    data-number="9">
                    9
                </button>

            </div>

        </div>


        <div class="actions">

            <button
                id="clearBtn"
                class="action-btn clear-btn">
                Очистить клетку
            </button>

            <button
                id="newGameBtn"
                class="action-btn new-game">
                Новая игра
            </button>

        </div>


        <div
            id="message"
            class="message info">
            Выбери пустую клетку
        </div>

    </div>


    <div class="footer">
        Цифры 1–9 · 3 ошибки максимум
    </div>

</div>


<!-- Окно окончания -->

<div id="gameOver" class="game-over">

    <div class="game-over-card">

        <div
            id="gameOverIcon"
            class="game-over-icon">
            😔
        </div>

        <h2 id="gameOverTitle">
            Игра окончена
        </h2>

        <p id="gameOverText">
            Ты допустил 3 ошибки.
            Попробуй ещё раз!
        </p>

        <button
            id="restartBtn"
            class="restart-btn">
            Начать заново
        </button>

    </div>

</div>


<script>

    const SIZE = 9;
    const MAX_ERRORS = 3;

    const difficulties = {

        easy: {
            name: "Лёгкий",
            empty: 36
        },

        medium: {
            name: "Средний",
            empty: 45
        },

        hard: {
            name: "Сложный",
            empty: 54
        }

    };


    let difficulty = "easy";

    let solution = [];
    let puzzle = [];
    let board = [];

    let selectedCell = null;

    let errors = 0;
    let gameFinished = false;


    const sudokuElement =
        document.getElementById("sudoku");

    const errorCountElement =
        document.getElementById("errorCount");

    const difficultyNameElement =
        document.getElementById("difficultyName");

    const messageElement =
        document.getElementById("message");

    const gameOverElement =
        document.getElementById("gameOver");

    const gameOverIcon =
        document.getElementById("gameOverIcon");

    const gameOverTitle =
        document.getElementById("gameOverTitle");

    const gameOverText =
        document.getElementById("gameOverText");


    /*
     * Создание решённой таблицы
     */

    function generateSolution() {

        const baseGrid = [];

        for (let row = 0; row < SIZE; row++) {

            baseGrid[row] = [];

            for (let col = 0; col < SIZE; col++) {

                const value =
                    (
                        row * 3 +
                        Math.floor(row / 3) +
                        col
                    ) % SIZE;

                baseGrid[row][col] = value;
            }
        }


        const numbers = shuffle(
            Array.from(
                { length: SIZE },
                (_, i) => i + 1
            )
        );


        const rows = shuffleGroups();
        const cols = shuffleGroups();

        const result = [];


        for (let r = 0; r < SIZE; r++) {

            result[r] = [];

            for (let c = 0; c < SIZE; c++) {

                const value =
                    baseGrid[rows[r]][cols[c]];

                result[r][c] =
                    numbers[value];
            }
        }


        return result;
    }


    function shuffleGroups() {

        const groups =
            shuffle([0, 1, 2]);

        const result = [];


        for (const group of groups) {

            const inside =
                shuffle([0, 1, 2]);

            for (const item of inside) {

                result.push(
                    group * 3 + item
                );
            }
        }


        return result;
    }


    function shuffle(array) {

        const result = [...array];


        for (
            let i = result.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );


            [
                result[i],
                result[j]
            ] = [
                result[j],
                result[i]
            ];
        }


        return result;
    }


    /*
     * Создание новой задачи
     */

    function createPuzzle() {

        solution = generateSolution();

        puzzle =
            solution.map(row => [...row]);


        const cells =
            shuffle(
                Array.from(
                    { length: 81 },
                    (_, i) => i
                )
            );


        const targetEmpty =
            difficulties[difficulty].empty;


        let removed = 0;

        const rowClues =
            Array(9).fill(9);

        const colClues =
            Array(9).fill(9);


        for (const index of cells) {

            if (removed >= targetEmpty) {
                break;
            }


            const row =
                Math.floor(index / 9);

            const col =
                index % 9;


            if (rowClues[row] <= 2) {
                continue;
            }


            if (colClues[col] <= 2) {
                continue;
            }


            puzzle[row][col] = 0;

            rowClues[row]--;
            colClues[col]--;

            removed++;
        }


        board =
            puzzle.map(row => [...row]);
    }


    /*
     * Отрисовка поля
     */

    function renderBoard() {

        sudokuElement.innerHTML = "";


        for (let row = 0; row < SIZE; row++) {

            for (let col = 0; col < SIZE; col++) {

                const cell =
                    document.createElement("div");


                cell.className = "cell";

                cell.dataset.row = row;
                cell.dataset.col = col;


                const value =
                    board[row][col];


                if (puzzle[row][col] !== 0) {

                    cell.textContent = value;

                    cell.classList.add("given");

                } else if (value !== 0) {

                    cell.textContent = value;

                    cell.classList.add(
                        "user-number"
                    );
                }


                cell.addEventListener(
                    "click",
                    () => {
                        selectCell(row, col);
                    }
                );


                sudokuElement.appendChild(cell);
            }
        }


        updateHighlights();
    }


    /*
     * Выбор клетки
     */

    function selectCell(row, col) {

        if (gameFinished) {
            return;
        }


        if (puzzle[row][col] !== 0) {

            selectedCell = null;

            setMessage(
                "Эта цифра уже задана в задаче",
                "info"
            );

            updateHighlights();

            return;
        }


        selectedCell = {
            row,
            col
        };


        setMessage(
            "Теперь выбери цифру от 1 до 9",
            "info"
        );


        updateHighlights();
    }


    /*
     * Подсветка поля
     */

    function updateHighlights() {

        const cells =
            document.querySelectorAll(".cell");


        cells.forEach(cell => {

            cell.classList.remove(
                "selected",
                "same-number"
            );


            cell.style.backgroundColor = "";


            if (!selectedCell) {
                return;
            }


            const row =
                Number(cell.dataset.row);

            const col =
                Number(cell.dataset.col);


            const selectedRow =
                selectedCell.row;

            const selectedCol =
                selectedCell.col;


            if (
                row === selectedRow &&
                col === selectedCol
            ) {

                cell.classList.add(
                    "selected"
                );
            }


            const selectedValue =
                board[selectedRow][selectedCol];


            if (
                selectedValue !== 0 &&
                Number(cell.textContent) ===
                    selectedValue
            ) {

                cell.classList.add(
                    "same-number"
                );
            }


            if (
                row === selectedRow ||
                col === selectedCol ||
                (
                    Math.floor(row / 3) ===
                    Math.floor(selectedRow / 3) &&

                    Math.floor(col / 3) ===
                    Math.floor(selectedCol / 3)
                )
            ) {

                if (
                    !cell.classList.contains(
                        "selected"
                    )
                ) {

                    cell.style.backgroundColor =
                        "#272932";
                }
            }

        });
    }


    /*
     * Ввод цифры
     */

    function enterNumber(number) {

        if (gameFinished) {
            return;
        }


        if (!selectedCell) {

            setMessage(
                "Сначала выбери пустую клетку",
                "error"
            );

            return;
        }


        const row =
            selectedCell.row;

        const col =
            selectedCell.col;


        if (puzzle[row][col] !== 0) {
            return;
        }


        /*
         * Неправильная цифра
         * не записывается.
         */

        if (
            number !==
            solution[row][col]
        ) {

            errors++;

            errorCountElement.textContent =
                errors;


            flashError();


            setMessage(
                "Неправильно! Цифра не была поставлена.",
                "error"
            );


            if (errors >= MAX_ERRORS) {

                finishGame(false);
            }


            return;
        }


        /*
         * Правильная цифра
         */

        board[row][col] = number;


        renderBoard();


        setMessage(
            "Правильно!",
            "success"
        );


        if (isComplete()) {

            finishGame(true);
        }
    }


    /*
     * Очистка клетки
     */

    function clearSelectedCell() {

        if (
            !selectedCell ||
            gameFinished
        ) {
            return;
        }


        const row =
            selectedCell.row;

        const col =
            selectedCell.col;


        if (puzzle[row][col] !== 0) {

            setMessage(
                "Исходные цифры нельзя удалить",
                "error"
            );

            return;
        }


        board[row][col] = 0;


        renderBoard();


        setMessage(
            "Клетка очищена",
            "info"
        );
    }


    /*
     * Проверка завершения
     */

    function isComplete() {

        for (let row = 0; row < 9; row++) {

            for (let col = 0; col < 9; col++) {

                if (board[row][col] === 0) {
                    return false;
                }


                if (
                    board[row][col] !==
                    solution[row][col]
                ) {

                    return false;
                }
            }
        }


        return true;
    }


    /*
     * Красная вспышка при ошибке
     */

    function flashError() {

        document.body.classList.remove(
            "error-flash"
        );


        void document.body.offsetWidth;


        document.body.classList.add(
            "error-flash"
        );


        setTimeout(() => {

            document.body.classList.remove(
                "error-flash"
            );

        }, 600);
    }


    /*
     * Завершение игры
     */

    function finishGame(won) {

        gameFinished = true;


        if (won) {

            gameOverIcon.textContent = "🎉";

            gameOverTitle.textContent =
                "Победа!";

            gameOverText.textContent =
                "Отлично! Судоку полностью решено.";

        } else {

            gameOverIcon.textContent = "😔";

            gameOverTitle.textContent =
                "Игра окончена";

            gameOverText.textContent =
                "Ты допустил 3 ошибки. Попробуй решить новую задачу!";
        }


        gameOverElement.classList.add(
            "show"
        );
    }


    /*
     * Новая игра
     */

    function startNewGame() {

        errors = 0;

        selectedCell = null;

        gameFinished = false;


        errorCountElement.textContent = "0";


        difficultyNameElement.textContent =
            difficulties[difficulty].name;


        createPuzzle();

        renderBoard();


        gameOverElement.classList.remove(
            "show"
        );


        setMessage(
            "Выбери пустую клетку",
            "info"
        );
    }


    /*
     * Сообщения
     */

    function setMessage(text, type) {

        messageElement.textContent = text;

        messageElement.className =
            "message " + type;
    }


    /*
     * Смена сложности
     */

    document
        .querySelectorAll("[data-difficulty]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            "[data-difficulty]"
                        )
                        .forEach(btn => {

                            btn.classList.remove(
                                "active"
                            );
                        });


                    button.classList.add(
                        "active"
                    );


                    difficulty =
                        button.dataset.difficulty;


                    startNewGame();
                }
            );
        });


    /*
     * Кнопки 1-9
     */

    document
        .querySelectorAll(".number-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const number =
                        Number(
                            button.dataset.number
                        );


                    enterNumber(number);
                }
            );
        });


    /*
     * Новая игра
     */

    document
        .getElementById("newGameBtn")
        .addEventListener(
            "click",
            startNewGame
        );


    /*
     * Очистить клетку
     */

    document
        .getElementById("clearBtn")
        .addEventListener(
            "click",
            clearSelectedCell
        );


    /*
     * Рестарт
     */

    document
        .getElementById("restartBtn")
        .addEventListener(
            "click",
            startNewGame
        );


    /*
     * Клавиатура
     */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key >= "1" &&
                event.key <= "9"
            ) {

                enterNumber(
                    Number(event.key)
                );

            } else if (
                event.key === "Backspace" ||
                event.key === "Delete"
            ) {

                clearSelectedCell();
            }
        }
    );


    /*
     * Запуск игры
     */

    startNewGame();

</script>

</body>
</html>
