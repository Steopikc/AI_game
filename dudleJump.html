<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doodle Jump</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#dff5ff,#f7fbff 55%,#eaf8ee);font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:400px;height:700px;overflow:hidden;background:#f8fcff;border:0;border-radius:22px;box-shadow:0 18px 50px rgba(35,90,120,.20)}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:14px;left:15px;z-index:5;font-size:21px;font-weight:800;color:#24516b;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);padding:7px 12px;border-radius:14px;box-shadow:0 4px 14px rgba(40,90,120,.10);pointer-events:none}
#best{font-size:12px;color:#6c8797;margin-top:2px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(246,252,255,.92);backdrop-filter:blur(7px);z-index:20;text-align:center}
#gameOver{display:none}
.title{font-size:42px;font-weight:900;letter-spacing:-2px;margin-bottom:8px;color:#285873}
.subtitle{color:#6b8290;font-size:15px;margin-bottom:28px}
button{padding:13px 30px;background:#65b9ef;color:#fff;border:0;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #3d8fca;transition:.12s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #3d8fca}
#mobileControls{position:absolute;bottom:15px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;z-index:10;pointer-events:none}
.mobileButton{width:64px;height:64px;border-radius:50%;border:2px solid rgba(0,0,0,.25);background:rgba(255,255,255,.72);backdrop-filter:blur(8px);box-shadow:0 5px 18px rgba(30,90,120,.12);display:flex;justify-content:center;align-items:center;font-size:30px;color:rgba(0,0,0,.55);pointer-events:auto;user-select:none}
@media(max-width:700px){#game{width:100vw;height:100vh;border:none;border-radius:0}#mobileControls{display:flex}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="hud"><div id="score">0</div><div id="best">BEST: 0</div></div>

<div id="menu" class="screen">
<div class="title">DOODLE JUMP</div>
<div class="subtitle">← → или A / D для движения</div>
<button id="startBtn">ИГРАТЬ</button>
</div>

<div id="gameOver" class="screen">
<div class="title">GAME OVER</div>
<div class="subtitle" id="finalScore">SCORE: 0</div>
<button id="restartBtn">ЕЩЁ РАЗ</button>
</div>

<div id="mobileControls">
<div class="mobileButton" id="left">←</div>
<div class="mobileButton" id="right">→</div>
</div>
</div>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const WIDTH=400, HEIGHT=700;

function resizeCanvas(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=WIDTH*dpr;
 canvas.height=HEIGHT*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const menu=document.getElementById("menu");
const gameOverScreen=document.getElementById("gameOver");
const scoreElement=document.getElementById("score");
const bestElement=document.getElementById("best");
const finalScore=document.getElementById("finalScore");
const startButton=document.getElementById("startBtn");
const restartButton=document.getElementById("restartBtn");

let running=false,score=0,cameraY=0,lastTime=0;
let best=Number(localStorage.getItem("doodleJumpBest")||0);
bestElement.textContent="BEST: "+best;

const GRAVITY=.43,JUMP_POWER=-11.5,ACCELERATION=.42,MAX_SPEED=4.2,FRICTION=.88;
const player={x:WIDTH/2-25,y:HEIGHT-120,width:50,height:54,vx:0,vy:0,squash:1,stretch:1,facing:1};
const keys={left:false,right:false};

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){keys.left=true;e.preventDefault()}
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){keys.right=true;e.preventDefault()}
 if((e.key===" "||e.key==="Enter")&&!running)startGame();
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
});

function setupTouchButton(el,dir){
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[dir]=true});
 el.addEventListener("pointerup",e=>{e.preventDefault();keys[dir]=false});
 el.addEventListener("pointercancel",()=>keys[dir]=false);
 el.addEventListener("pointerleave",()=>keys[dir]=false);
}
setupTouchButton(document.getElementById("left"),"left");
setupTouchButton(document.getElementById("right"),"right");

const PLATFORM_HEIGHT=12,MIN_PLATFORM_WIDTH=58,MAX_PLATFORM_WIDTH=80;
const WALL_WIDTH=16;
const MIN_GAP_Y=55,MAX_GAP_Y=82,MAX_HORIZONTAL_GAP=105;
let platforms=[];

function createPlatform(x,y,width){return{x,y,width,height:PLATFORM_HEIGHT}}

function createReachablePlatform(previous){
 const width=MIN_PLATFORM_WIDTH+Math.random()*(MAX_PLATFORM_WIDTH-MIN_PLATFORM_WIDTH);
 const gapY=MIN_GAP_Y+Math.random()*(MAX_GAP_Y-MIN_GAP_Y);
 const y=previous.y-gapY;
 const previousCenter=previous.x+previous.width/2;
 let center=previousCenter+(Math.random()*2-1)*MAX_HORIZONTAL_GAP;
 const halfWidth=width/2;
 center=Math.max(halfWidth+5,Math.min(WIDTH-halfWidth-5,center));
 return createPlatform(center-halfWidth,y,width);
}

function generateInitialPlatforms(){
 platforms=[];
 let previous=createPlatform(WIDTH/2-45,HEIGHT-55,90);
 platforms.push(previous);
 for(let i=0;i<30;i++){
  const next=createReachablePlatform(previous);
  platforms.push(next);
  previous=next;
 }
}

function generateMorePlatforms(){
 let highest=platforms[0];
 for(const p of platforms)if(p.y<highest.y)highest=p;
 let previous=highest;
 for(let i=0;i<7;i++){
  const next=createReachablePlatform(previous);
  platforms.push(next);
  previous=next;
 }
}

function startGame(){
 menu.style.display="none";
 gameOverScreen.style.display="none";
 score=0;cameraY=0;
 player.x=WIDTH/2-player.width/2;
 player.y=HEIGHT-100;
 player.vx=0;player.vy=JUMP_POWER;
 player.squash=1;player.stretch=1;
 keys.left=false;keys.right=false;
 generateInitialPlatforms();
 scoreElement.textContent="0";
 running=true;
 lastTime=performance.now();
 requestAnimationFrame(gameLoop);
}

function endGame(){
 running=false;
 if(score>best){
  best=score;
  localStorage.setItem("doodleJumpBest",best);
 }
 bestElement.textContent="BEST: "+best;
 finalScore.textContent="SCORE: "+score;
 gameOverScreen.style.display="flex";
}
startButton.addEventListener("click",startGame);
restartButton.addEventListener("click",startGame);

function update(dt){
 const factor=Math.min(dt/16.666,2);

 if(keys.left){player.vx-=ACCELERATION*factor;player.facing=-1}
 if(keys.right){player.vx+=ACCELERATION*factor;player.facing=1}
 if(!keys.left&&!keys.right)player.vx*=Math.pow(FRICTION,factor);
 player.vx=Math.max(-MAX_SPEED,Math.min(MAX_SPEED,player.vx));
 player.x+=player.vx*factor;

 if(player.x>WIDTH)player.x=-player.width;
 if(player.x+player.width<0)player.x=WIDTH;

 const oldBottom=player.y+player.height;
 player.vy+=GRAVITY*factor;
 player.y+=player.vy*factor;

 if(player.vy>0){
  for(const platform of platforms){
   const bottom=player.y+player.height;
   const crossed=oldBottom<=platform.y;
   const height=bottom>=platform.y&&bottom<=platform.y+18;
   const horizontal=player.x+player.width>platform.x&&player.x<platform.x+platform.width;
   if(crossed&&height&&horizontal){
    player.y=platform.y-player.height;
    player.vy=JUMP_POWER;
    player.squash=.82;
    player.stretch=1.15;
    break;
   }
  }
 }

 const cameraTarget=player.y-HEIGHT*.42;
 if(cameraTarget<cameraY)cameraY+=(cameraTarget-cameraY)*.12*factor;

 const newScore=Math.max(0,Math.floor(-cameraY/10));
 if(newScore>score){score=newScore;scoreElement.textContent=score}

 let highest=platforms[0];
 for(const p of platforms)if(p.y<highest.y)highest=p;
 if(highest.y>cameraY-250)generateMorePlatforms();

 platforms=platforms.filter(p=>p.y<cameraY+HEIGHT+100);

 player.squash+=(1-player.squash)*.15;
 player.stretch+=(1-player.stretch)*.15;

 if(player.y-cameraY>HEIGHT+100)endGame();
}

function draw(){
 ctx.clearRect(0,0,WIDTH,HEIGHT);
 ctx.save();
 ctx.translate(0,-cameraY);
 drawBackground();
 drawPlatforms();
 drawPlayer();
 ctx.restore();
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,cameraY,0,cameraY+HEIGHT);
  g.addColorStop(0,"#dff5ff"); g.addColorStop(.62,"#f7fcff"); g.addColorStop(1,"#e8f8ee");
  ctx.fillStyle=g; ctx.fillRect(0,cameraY,WIDTH,HEIGHT);

  const drift=Math.sin(cameraY*.002)*18;
  for(let i=0;i<7;i++){
    const x=((i*83+drift)%470)-35, y=cameraY+75+i*125;
    ctx.fillStyle="rgba(255,255,255,.62)";
    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2); ctx.arc(x+20,y-5,24,0,Math.PI*2); ctx.arc(x+45,y,17,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="rgba(100,180,210,.16)";
  const startY=Math.floor(cameraY/80)*80;
  for(let y=startY;y<cameraY+HEIGHT+80;y+=80){
    for(let x=20;x<WIDTH;x+=55){
      ctx.beginPath(); ctx.arc(x+Math.sin(y*.03+x)*4,y+20,2,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawWalls(){
  const top=cameraY, bottom=cameraY+HEIGHT;

  // Soft shadows.
  ctx.fillStyle="rgba(32,82,105,.10)";
  ctx.fillRect(0,top,WALL_WIDTH+3,HEIGHT);
  ctx.fillRect(WIDTH-WALL_WIDTH-3,top,WALL_WIDTH+3,HEIGHT);

  // Left wall.
  let g=ctx.createLinearGradient(0,0,WALL_WIDTH,0);
  g.addColorStop(0,"#75b9d7");
  g.addColorStop(1,"#b9e8f6");
  ctx.fillStyle=g;
  ctx.fillRect(0,top,WALL_WIDTH,HEIGHT);

  // Right wall.
  g=ctx.createLinearGradient(WIDTH-WALL_WIDTH,0,WIDTH,0);
  g.addColorStop(0,"#b9e8f6");
  g.addColorStop(1,"#75b9d7");
  ctx.fillStyle=g;
  ctx.fillRect(WIDTH-WALL_WIDTH,top,WALL_WIDTH,HEIGHT);

  // Highlight strips.
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.fillRect(WALL_WIDTH-3,top,3,HEIGHT);
  ctx.fillRect(WIDTH-WALL_WIDTH,top,3,HEIGHT);

  // Small repeating markers make the borders easy to see.
  ctx.fillStyle="rgba(60,125,150,.25)";
  for(let y=Math.floor(top/32)*32;y<bottom+32;y+=32){
    ctx.fillRect(4,y,7,3);
    ctx.fillRect(WIDTH-11,y,7,3);
  }
}

function drawPlatforms(){
  for(const p of platforms){
    ctx.fillStyle="rgba(38,105,125,.14)";
    roundRect(p.x+2,p.y+6,p.width,p.height+4,8); ctx.fill();

    const g=ctx.createLinearGradient(0,p.y,0,p.y+p.height);
    g.addColorStop(0,"#8fe3a1"); g.addColorStop(1,"#5bcf82");
    ctx.fillStyle=g; roundRect(p.x,p.y,p.width,p.height+2,8); ctx.fill();

    ctx.fillStyle="rgba(255,255,255,.55)";
    roundRect(p.x+4,p.y+2,p.width-8,3,2); ctx.fill();

    ctx.strokeStyle="rgba(49,145,93,.55)"; ctx.lineWidth=1;
    roundRect(p.x,p.y,p.width,p.height+2,8); ctx.stroke();
  }
}

function drawPlayer(){
  const cx=player.x+player.width/2, cy=player.y+player.height/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.translate(0,Math.sin(performance.now()*.012)*1.5);
  ctx.scale(player.squash,player.stretch);

  ctx.save();
  ctx.globalAlpha=.14; ctx.fillStyle="#27556a";
  ctx.beginPath(); ctx.ellipse(0,25,22,6,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  if(birdImage.complete && birdImage.naturalWidth){
    const size=68;
    ctx.drawImage(birdImage,-size/2,-size/2,size,size);
  }
  ctx.restore();
}

function roundRect(x,y,width,height,radius){
 radius=Math.min(radius,width/2,height/2);
 ctx.beginPath();
 ctx.moveTo(x+radius,y);
 ctx.arcTo(x+width,y,x+width,y+height,radius);
 ctx.arcTo(x+width,y+height,x,y+height,radius);
 ctx.arcTo(x,y+height,x,y,radius);
 ctx.arcTo(x,y,x+width,y,radius);
 ctx.closePath();
}

function gameLoop(time){
 if(!running){draw();return}
 let dt=time-lastTime;
 if(dt>50)dt=50;
 lastTime=time;
 update(dt);
 draw();
 if(running)requestAnimationFrame(gameLoop);
}

generateInitialPlatforms();
draw();
</script>
